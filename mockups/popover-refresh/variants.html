<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singe Popover Refresh</title>
<style>
  :root {
    --chrome-bg: #EEF0F3; --chrome-ink: #111318; --chrome-muted: #6B7280; --chrome-line: #DDE0E5;
    /* Sorph ribbon hues 236 / 184 / 290, a touch richer so a 1px rim reads on white */
    --r1: hsl(236 58% 62%); --r2: hsl(184 55% 52%); --r3: hsl(290 50% 64%);
    --ink: #0B0B0E; --soft: #3A3A40; --muted: #8A8A93; --hair: rgba(0,0,0,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--chrome-bg); color: var(--chrome-ink);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { padding: 28px 32px 6px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
  header h1 { margin: 0; font: 600 22px -apple-system, sans-serif; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--chrome-muted); font-size: 14px; max-width: 760px; }
  .bgs { margin-left: auto; display: flex; gap: 4px; background: #fff; border: 1px solid var(--chrome-line); border-radius: 999px; padding: 4px; }
  .bgs button { border: 0; background: none; font: 500 12.5px -apple-system, sans-serif; color: var(--chrome-muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .bgs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; padding: 18px 32px 40px; }
  @media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 20px 16px 4px; } }
  .cell { background: #fff; border: 1px solid var(--chrome-line); border-radius: 16px; overflow: hidden; }
  .cell > .cap { padding: 14px 18px 12px; border-bottom: 1px solid var(--chrome-line); }
  .cap b { font-size: 15px; } .cap span { color: var(--chrome-muted); font-size: 13px; display: block; margin-top: 3px; }

  /* the page behind the popover, like the screenshot */
  .stage { position: relative; height: 690px; overflow: hidden; padding: 18px 22px; font: 14px/1.5 Helvetica, Arial, sans-serif; color: #2343a8; }
  .stage p { margin: 0 0 12px; }
  .stage .note { margin: 18px -40px 0; padding: 18px 40px; border: 1px solid #2c3f8f; border-radius: 10px; color: #222; font: 500 22px/1.45 "Avenir Next", sans-serif; }
  .stage .note i { color: #b3262f; font-style: normal; }
  .stage h2 { position: absolute; left: 0; right: 0; bottom: 38px; margin: 0; padding: 0 12px; font: 600 27px/1.2 "Avenir Next", sans-serif; color: #111; white-space: nowrap; }
  .stage.dark { background: #16181d; color: #8fb0ff; } .stage.dark .note { color: #ddd; border-color: #4d5c9c; } .stage.dark h2 { color: #f1f1f1; }
  .stage.photo { background: linear-gradient(135deg, #f3a86b, #d9487a 40%, #4a3bb0 75%, #1c9fb3); color: #fff; } .stage.photo .note { color: #fff; border-color: rgba(255,255,255,.6); } .stage.photo h2 { color: #fff; }
  .hl { position: relative; display: inline-block; padding: 0 12px; margin: 0 -2px; border-radius: 12px; color: #fff; background: #07080d; overflow: hidden; }
  .hl::before { content: ""; position: absolute; inset: -60%; background:
      radial-gradient(closest-side, color-mix(in srgb, var(--r1) 80%, transparent), transparent 70%) 20% 40% / 50% 60% no-repeat,
      radial-gradient(closest-side, color-mix(in srgb, var(--r2) 70%, transparent), transparent 70%) 70% 60% / 45% 55% no-repeat,
      radial-gradient(closest-side, color-mix(in srgb, var(--r3) 70%, transparent), transparent 70%) 50% 30% / 40% 50% no-repeat;
    animation: drift 7s ease-in-out infinite alternate; opacity: .55; }
  .hl span { position: relative; }
  @keyframes drift { to { transform: translate(14%, -10%) rotate(25deg); } }

  /* ---------- shared popover machinery ---------- */
  .pop { position: absolute; left: 50%; bottom: 84px; width: 372px; transform: translateX(-50%); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; animation: open .42s cubic-bezier(.2, 1.4, .35, 1) both; transform-origin: 50% 100%; }
  @keyframes open { from { opacity: 0; transform: translateX(-50%) scale(.96) translateY(6px); } }
  .pop > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .pop .shadow { filter: blur(18px); fill: rgba(20,22,40,.20); transform: translateY(10px); }
  .pop .glass { position: relative; background: rgba(255,255,255,.80); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); padding-bottom: 8px; }
  .pop .rim { fill: none; stroke-width: 1.2; }
  .pop .glint { fill: none; stroke-width: 1.4; mix-blend-mode: screen; }
  .star { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); transition: color .15s, background .15s, transform .25s cubic-bezier(.2, 1.8, .4, 1); }
  .star:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .star svg { width: 15px; height: 15px; }
  .star .n { display: none; }
  .C .sense .star .n { display: block; }
  .star[aria-pressed="true"] { color: var(--ink); transform: scale(1.08); }
  .star[aria-pressed="true"] svg path { fill: currentColor; }
  .sense { cursor: pointer; }
  .gloss { color: var(--soft); font-size: 13px; line-height: 1.45; }
  .kbd { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border: 1px solid rgba(0,0,0,.14); border-radius: 5px; font-size: 10.5px; color: var(--soft); margin: 0 2px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); padding: 0 16px; }

  /* ---------- A · Halo ---------- */
  .A .head { display: flex; align-items: baseline; gap: 8px; padding: 16px 18px 10px; }
  .A .head h3 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
  .A .head small { color: var(--muted); font-size: 12.5px; }
  .A .sense { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px 11px 18px; border-top: 1px solid var(--hair); }
  .A .sense .txt { flex: 1; min-width: 0; }
  .A .sense .t { font-size: 14px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; }
  .A .sense .tag { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .A .sense .gloss { display: none; margin-top: 5px; }
  .A .sense.on .gloss { display: block; }
  .A .sense:not(.on) .t { color: var(--soft); font-weight: 500; }
  .A .sense .star { margin-top: -4px; opacity: 0; } .A .sense:hover .star, .A .sense.on .star, .A .star[aria-pressed="true"] { opacity: 1; }
  .A .rank { display: flex; align-items: center; gap: 6px; padding: 9px 18px; border-top: 1px solid var(--hair); font-size: 11.5px; color: var(--muted); }
  .A .ask { margin: 4px 12px 10px; display: flex; align-items: center; gap: 8px; padding: 9px 9px 9px 13px; border: 1px solid var(--ink); border-radius: 11px; background: rgba(255,255,255,.6); }
  .A .ask span { flex: 1; font-size: 13px; color: var(--muted); }
  .A .ask em { font-style: normal; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border: 1px solid var(--ink); border-radius: 999px; color: var(--ink); }

  /* ---------- B · Focus ---------- */
  .B .head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
  .B .head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .B .head small { font-size: 11.5px; color: var(--muted); }
  .B .list { padding: 0 8px; display: grid; gap: 2px; }
  .B .sense { display: flex; gap: 8px; align-items: flex-start; padding: 9px 6px 9px 12px; border-radius: 12px; transition: background .15s; }
  .B .sense:hover { background: rgba(0,0,0,.035); }
  .B .sense.on { background: rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 14px rgba(20,22,40,.06); }
  .B .sense .txt { flex: 1; min-width: 0; }
  .B .sense .t { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .B .sense:not(.on) .t { font-weight: 500; color: var(--soft); }
  .B .sense .gloss { display: none; margin-top: 4px; }
  .B .sense.on .gloss { display: block; }
  .B .sense .tag { flex: none; font-size: 10.5px; color: var(--muted); padding-top: 3px; }
  .B .sense .star { margin-top: -4px; }
  .B .ask { margin: 10px 12px 10px; display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 15px; border: 1.5px solid var(--ink); border-radius: 999px; background: #fff; }
  .B .ask span { flex: 1; font-size: 13px; color: var(--muted); }
  .B .ask em { font-style: normal; font-size: 10.5px; font-weight: 600; color: var(--ink); }
  .B .ask i { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; opacity: .25; }

  /* ---------- C · Index ---------- */
  .C .head { padding: 18px 18px 12px; display: flex; align-items: flex-end; justify-content: space-between; }
  .C .head h3 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .C .head small { font: 10.5px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .C .sense { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; padding: 10px 18px 10px 10px; border-top: 1px solid var(--hair); position: relative; }
  .C .sense .star { grid-row: span 2; margin-top: -5px; }
  .C .sense .star .n { font: 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
  .C .sense .star svg { display: none; }
  .C .sense:hover .star .n, .C .star[aria-pressed="true"] .n { display: none; }
  .C .sense:hover .star svg, .C .star[aria-pressed="true"] svg { display: block; }
  .C .sense .t { font-size: 14px; font-weight: 600; line-height: 1.3; display: flex; justify-content: space-between; gap: 10px; }
  .C .sense:not(.on) .t { font-weight: 500; color: var(--soft); }
  .C .sense .t small { flex: none; font: 10px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .C .sense .gloss { display: none; }
  .C .sense.on .gloss { display: block; }
  .C .sense.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: linear-gradient(var(--r1), var(--r2), var(--r3)); }
  .C .ask { margin: 2px 12px 10px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--ink); border-radius: 8px; }
  .C .ask span { flex: 1; font-size: 13px; color: var(--muted); }
  .C .ask em { font: 10px ui-monospace, "SF Mono", Menlo, monospace; font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .C .ask em::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-right: 6px; vertical-align: 1px; }
  .C .foot { font: 10px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em; text-transform: uppercase; padding-top: 2px; }

  /* bookmark picker: colourless collections, opened from a meaning's star */
  .picker { position: absolute; right: -8px; width: 214px; z-index: 5; padding: 6px; border-radius: 12px; background: rgba(255,255,255,.9);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 12px 30px rgba(20,22,40,.18);
    font-size: 13px; color: var(--ink); animation: pk .22s cubic-bezier(.2, 1.4, .35, 1) both; transform-origin: 90% 0; }
  @keyframes pk { from { opacity: 0; transform: scale(.94) translateY(-4px); } }
  .picker .lbl { padding: 5px 8px 4px; font-size: 11px; color: var(--muted); }
  .picker button.c { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .picker button.c:hover { background: rgba(0,0,0,.05); }
  .picker .box { width: 15px; height: 15px; border: 1.3px solid rgba(0,0,0,.35); border-radius: 4px; display: grid; place-items: center; flex: none; }
  .picker .on .box { background: var(--ink); border-color: var(--ink); }
  .picker .on .box::after { content: ""; width: 7px; height: 4px; border: 1.6px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .picker .c small { margin-left: auto; color: var(--muted); font-size: 11px; }
  .picker hr { border: 0; border-top: 1px solid var(--hair); margin: 5px 2px; }
  .picker .new { color: var(--soft); }
  .picker input { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--ink); border-radius: 7px; outline: none; background: #fff; }
  .saved-in { font-size: 11px; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
<header>
  <h1>Singe popover · three directions</h1>
  <p>White frosted glass, a 1px rim that moves like the highlight, a black-outlined follow-up, and a star on each meaning that files that meaning into collections you create (no colours). Click a meaning to open it; click its star to bookmark it.</p>
  <div class="bgs" role="group" aria-label="Page behind">
    <button data-bg="" aria-pressed="true">Light page</button><button data-bg="dark" aria-pressed="false">Dark page</button><button data-bg="photo" aria-pressed="false">Colour</button>
  </div>
</header>
<main id="cells"></main>

<template id="page">
  <div class="stage">
    <p>Some mod_proxy configurations on Apache HTTP Server versions 2.4.0 through 2.4.55 allow a HTTP Request Smuggling attack.</p>
    <p>Configurations are affected when mod_proxy is enabled along with some form of RewriteRule or ProxyPassMatch in which a non-specific pattern matches some portion of the user-supplied request-target (URL) data and is then re-inserted into the proxied request-target using variable substitution.</p>
    <p>For example, something like: RewriteEngine on · RewriteRule "^/here/(.*)" · ProxyPassReverse /here/</p>
    <p>Request splitting/smuggling could result in bypass of access controls in the proxy server, proxying unintended URLs to existing origin servers, and cache poisoning.</p>
    <div class="note"><b>Note</b> — version specific advice can usually be found by a specialist who can update the <i>Vulnerabilities</i> to prevent the version and close all open ports.</div>
    <h2>Task 3 - Scan Detected <span class="hl"><span>Hosts</span></span> for Vulnerabilities</h2>
  </div>
</template>

<script>
const SENSES = [
  { t: "Any computer attached to a network", tag: "Computing", g: "A computer or device on a network that other machines can reach by address, such as a server running a web site." },
  { t: "To run software made available to a remote user or process", tag: "Computing", g: "To run software made available to a remote user or process, e.g. to host a web site." },
  { t: "A person or organization responsible for running an event", tag: "Noun", g: "A person or organization responsible for running an event, or who receives guests." },
];
const VARIANTS = [
  { k: "A", name: "A · Halo", note: "Closest to today, quieter. Stars appear on hover and stay on the saved meaning. Rim sweeps slowly." },
  { k: "B", name: "B · Focus", note: "The chosen meaning lifts into a white card. Pill follow-up with a black send dot. Rim glints once on open." },
  { k: "C", name: "C · Index", note: "Editorial. The number turns into a star on hover; the chosen meaning gets a ribbon bar. Mono details." },
];
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const SPARK = '<svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="currentColor"/></svg>';
const SEND = '<svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function star(i) { return `<button class="star" aria-pressed="false" aria-label="Save this meaning"><span class="n">${i + 1}</span>${STAR}</button>`; }

function body(k) {
  if (k === "A") return `
    <div class="head"><h3>Hosts</h3><small>host</small></div>
    ${SENSES.map((s, i) => `<div class="sense${i ? "" : " on"}"><div class="txt"><div class="t">${s.t}</div><div class="tag">${s.tag}</div><div class="gloss">${s.g}</div></div>${star(i)}</div>`).join("")}
    <div class="rank">${SPARK} Ranked for OWASP, CVEs</div>
    <div class="ask"><span>Ask a follow-up…</span><em>Coming soon</em></div>
    <div class="foot"><span>Release <span class="kbd">⌃</span> to close</span><span>Local · Wiktionary</span></div>`;
  if (k === "B") return `
    <div class="head"><h3>Hosts</h3><small>3 meanings · ranked for OWASP</small></div>
    <div class="list">${SENSES.map((s, i) => `<div class="sense${i ? "" : " on"}"><div class="txt"><div class="t">${s.t}</div><div class="gloss">${s.g}</div></div><span class="tag">${s.tag}</span>${star(i)}</div>`).join("")}</div>
    <div class="ask"><span>Ask a follow-up…</span><em>Coming soon</em><i>${SEND}</i></div>
    <div class="foot"><span>Release <span class="kbd">⌃</span> to close</span><span>Local · Wiktionary</span></div>`;
  return `
    <div class="head"><h3>Hosts</h3><small>host · noun, verb</small></div>
    ${SENSES.map((s, i) => `<div class="sense${i ? "" : " on"}">${star(i)}<div class="t">${s.t}<small>${s.tag}</small></div><div class="gloss">${s.g}</div></div>`).join("")}
    <div class="ask"><span>Ask a follow-up…</span><em>Coming soon</em></div>
    <div class="foot"><span>⌃ release to close</span><span>Ranked: OWASP · Wiktionary</span></div>`;
}

// Same outline as PopoverShape in PopoverView.swift: rounded rect with an arrow under the term.
function shape(w, h, ax, a = 8, r = 14) {
  const b = h - a, x = Math.min(Math.max(ax, r + a), w - r - a);
  return `M${r} 0H${w - r}A${r} ${r} 0 0 1 ${w} ${r}V${b - r}A${r} ${r} 0 0 1 ${w - r} ${b}H${x + a}L${x} ${h}L${x - a} ${b}H${r}A${r} ${r} 0 0 1 0 ${b - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`;
}

const cells = document.getElementById("cells");
const pops = [];
VARIANTS.forEach((v, n) => {
  const cell = document.createElement("section");
  cell.className = "cell";
  cell.innerHTML = `<div class="cap"><b>${v.name}</b><span>${v.note}</span></div>`;
  cell.appendChild(document.getElementById("page").content.cloneNode(true));
  const pop = document.createElement("div");
  pop.className = "pop " + v.k;
  pop.innerHTML = `
    <svg aria-hidden="true"><path class="shadow"/></svg>
    <div class="glass">${body(v.k)}<div style="height:8px"></div></div>
    <svg aria-hidden="true">
      <defs>
        <linearGradient id="rim${n}" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="var(--r1)"/><stop offset=".35" stop-color="var(--r2)"/><stop offset=".7" stop-color="var(--r3)"/><stop offset="1" stop-color="var(--r1)"/></linearGradient>
        <linearGradient id="glint${n}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <path class="rim" stroke="url(#rim${n})"/><path class="glint" stroke="url(#glint${n})"/>
    </svg>`;
  cell.querySelector(".stage").appendChild(pop);
  cells.appendChild(cell);
  pops.push({ pop, n, k: v.k, born: performance.now() });

  pop.querySelectorAll(".sense").forEach((row, i) => row.addEventListener("click", e => {
    if (e.target.closest(".picker")) return;
    const st = e.target.closest(".star");
    if (st) { e.stopPropagation(); openPicker(pop, row, i, st); return; }
    pop.querySelectorAll(".sense").forEach(r => r.classList.toggle("on", r === row));
    closePicker(); layout(pops.find(p => p.pop === pop));
  }));
});

// Collections are shared by all three mock-ups so you can compare the same state.
const COLLECTIONS = [{ name: "Security+", items: new Set() }, { name: "Networking", items: new Set() }, { name: "Work · OWASP lab", items: new Set() }];
let picker = null;
function closePicker() { picker?.remove(); picker = null; }
document.addEventListener("click", e => { if (picker && !e.target.closest(".picker, .star")) closePicker(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });

function refreshStars() {
  document.querySelectorAll(".pop").forEach(pop => pop.querySelectorAll(".sense").forEach((row, i) => {
    const inC = COLLECTIONS.filter(c => c.items.has(i)), st = row.querySelector(".star");
    st.setAttribute("aria-pressed", inC.length > 0);
    st.setAttribute("aria-label", inC.length ? "Saved in " + inC.map(c => c.name).join(", ") : "Save this meaning");
    let note = row.querySelector(".saved-in");
    const host = row.querySelector(".txt") || row;
    if (inC.length) { if (!note) { note = document.createElement("div"); note.className = "saved-in"; if (!row.querySelector(".txt")) note.style.gridColumn = "2"; host.appendChild(note); } note.textContent = "Saved in " + inC.map(c => c.name).join(", "); }
    else note?.remove();
  }));
  pops.forEach(layout);
}

function openPicker(pop, row, i, st) {
  const again = picker && picker.dataset.key === pop.className + i;
  closePicker(); if (again) return;
  picker = document.createElement("div");
  picker.className = "picker"; picker.dataset.key = pop.className + i;
  const draw = () => {
    picker.innerHTML = `<div class="lbl">Save “${SENSES[i].t.split(" ").slice(0, 4).join(" ")}…” to</div>` +
      COLLECTIONS.map((c, k) => `<button class="c${c.items.has(i) ? " on" : ""}" data-k="${k}"><span class="box"></span>${c.name}<small>${c.items.size}</small></button>`).join("") +
      `<hr><button class="c new">＋ New collection…</button>`;
    picker.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { const c = COLLECTIONS[b.dataset.k]; c.items.has(i) ? c.items.delete(i) : c.items.add(i); draw(); refreshStars(); });
    picker.querySelector(".new").onclick = () => {
      const hr = picker.querySelector(".new"); const inp = document.createElement("input"); inp.placeholder = "Collection name, then Return"; hr.replaceWith(inp); inp.focus();
      inp.onkeydown = ev => { if (ev.key === "Enter" && inp.value.trim()) { COLLECTIONS.push({ name: inp.value.trim(), items: new Set([i]) }); draw(); refreshStars(); } if (ev.key === "Escape") draw(); ev.stopPropagation(); };
    };
  };
  draw();
  picker.style.top = (row.offsetTop + st.offsetTop + st.offsetHeight + 4) + "px";
  pop.appendChild(picker);
}

function layout(p) {
  const { pop } = p, g = pop.querySelector(".glass");
  g.style.paddingBottom = "8px";
  const w = pop.offsetWidth, h = g.offsetHeight + 8;
  const d = shape(w, h, w / 2);
  g.style.clipPath = `path("${d}")`; g.style.height = h + "px";
  pop.querySelectorAll("path.shadow, path.rim, path.glint").forEach(el => el.setAttribute("d", d));
  p.w = w; p.h = h;
}
pops.forEach(layout);
addEventListener("resize", () => pops.forEach(layout));

// rim: hues turn slowly (A and C), or a single glint on open (B); the glint travels the edge like the highlight's specular
function frame(now) {
  for (const p of pops) {
    const t = (now - p.born) / 1000;
    const rot = p.k === "B" ? 30 : (t * 18) % 360;
    p.pop.querySelector(`#rim${p.n}`).setAttribute("gradientTransform", `rotate(${rot} .5 .5)`);
    const gl = p.pop.querySelector(`#glint${p.n}`);
    const period = p.k === "B" ? 1e9 : 6;
    const phase = p.k === "B" ? Math.min(t / 1.4, 1.2) : (t % period) / period;
    const x = -0.4 * p.w + phase * 1.8 * p.w;
    gl.setAttribute("x1", x - 70); gl.setAttribute("x2", x + 70); gl.setAttribute("y1", 0); gl.setAttribute("y2", 30);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.querySelectorAll(".bgs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".bgs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.querySelectorAll(".stage").forEach(s => s.className = "stage " + b.dataset.bg);
}));
</script>
</body>
